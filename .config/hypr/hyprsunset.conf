# Scheduled night light. Omarchy's shell only exposes a manual toggle, so the
# schedule lives here and hyprsunset gets started from autostart.lua.

# Daytime sets an explicit neutral temperature rather than identity = true.
# With identity the screen stays stuck on the evening tint instead of clearing.
profile {
    time = 07:00
    temperature = 6500
}

profile {
    time = 20:00
    temperature = 4000
}
